[project]
name = "aie2026-exercises"
version = "0.1.0"
description = "AI Engineering Pilot Course (AIE2026) के अभ्यास और होमवर्क की रिपॉज़िटरी (अध्ययन सहायक एजेंट विकसित करें)"
readme = "README.md"
requires-python = ">=3.12"
# पाठ्यक्रम के दौरान बदलाव से बचने के लिए संस्करण निश्चित रखें
dependencies = [
    "google-genai==2.31.0",
    "pydantic-ai-slim[google,mcp]==2.57.0",  # mcp का उपयोग Lecture 05 (MCP सर्वर और क्लाइंट) में होता है
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:pydantic_graph"]
